<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediStock - Pharmacy Management</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="login-container">


        <!-- Floating Background Bubbles -->

        <div class="bubble bubble1"></div>
        <div class="bubble bubble2"></div>
        <div class="bubble bubble3"></div>
        <div class="bubble bubble4"></div>
        <div class="bubble bubble5"></div>
        <div class="bubble bubble6"></div>
        <div class="bubble bubble7"></div>
        <div class="bubble bubble8"></div>
        <div class="bubble bubble9"></div>
        <div class="bubble bubble10"></div>
        <div class="bubble bubble11"></div>
        <div class="bubble bubble12"></div>
        <div class="bubble bubble13"></div>
        <div class="bubble bubble14"></div>
        <div class="bubble bubble15"></div>


        <!-- Medical Crosses -->

        <div class="medical-crosses">

            <span>+</span>
            <span>+</span>
            <span>+</span>
            <span>+</span>
            <span>+</span>

        </div>


        <!-- Login Card -->

        <div class="login-box">


            <!-- Logo -->

            <div class="logo">
                <span>✚</span>
            </div>


            <!-- Title -->

            <h1>Medi<span>Stock</span></h1>

            <p class="subtitle">
                Pharmacy Management System
            </p>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- Username -->

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                >


                <!-- Password -->

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                    >

                    <button
                        type="button"
                        id="togglePassword">
                        Show
                    </button>

                </div>


                <!-- Error Message -->

                <p id="errorMessage"></p>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-button">
                    Login
                </button>


            </form>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
